name: project_metadata
description: Schema for project_metadata.json at the project root.

fields:
  - name: format_version
    type: string
    required: true
    description: |
      BimDown format version, which also selects the geometry encoding:
      "1" = CSV + SVG (2D geometry), "2" = CSV + GeoJSON (2D/3D geometry).
      Both encodings are fully supported; 2 is the default for new projects.
      Tools may also detect the encoding from the geometry files present
      (*.svg vs *.geojson).

  - name: project_name
    type: string
    description: Human-readable project name

  - name: units
    type: enum
    values: [m, ft, in, mm]
    description: |
      Unit system for all coordinates and dimensions in this project's CSV/GeoJSON
      files (store-as-displayed model — no internal canonical unit, every numeric
      value is in this unit). Defaults to "m" when missing to preserve existing
      projects. Abbreviations: m = meter, ft = foot, in = inch, mm = millimeter.
    default: m

  - name: source
    type: string
    description: Export source (e.g. "Revit 2026", "BimDown CLI")

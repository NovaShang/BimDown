name: project_metadata
description: Schema for project_metadata.json at the project root.

fields:
  - name: format_version
    type: string
    required: true
    description: |
      BimDown format version, which also selects the geometry encoding:
      "1" = CSV + SVG (2D geometry), "2" = CSV + GeoJSON (2D/3D geometry).
      Both encodings are fully supported; 2 is the default for new projects.
      Tools may also detect the encoding from the geometry files present
      (*.svg vs *.geojson).

  - name: project_name
    type: string
    description: Human-readable project name

  - name: project_number
    type: string
    description: Project number shown in sheet title blocks

  - name: client
    type: string
    description: Client name shown in sheet title blocks

  - name: address
    type: string
    description: Site address shown in sheet title blocks

  - name: units
    type: enum
    values: [m, ft, in, mm]
    description: |
      Unit system for all coordinates and dimensions in this project's CSV/GeoJSON
      files (store-as-displayed model — no internal canonical unit, every numeric
      value is in this unit). Defaults to "m" when missing to preserve existing
      projects. Abbreviations: m = meter, ft = foot, in = inch, mm = millimeter.
    default: m

  - name: source
    type: string
    description: Export source (e.g. "Revit 2026", "BimDown CLI")

  - name: spatial_z
    type: enum
    values: [absolute]
    description: |
      Marker that the Z in spatial elements' coordinates (beam, duct,
      equipment, … — GeoJSON spec §4.2) is absolute, as the spec requires.
      Written by tools that guarantee it (CLI `init`, bim.jouledown.com, the BimDown
      editor, the legacy migration script). Older hosted projects (bim-claw.com, formerly BimClaw) without it
      may hold level-relative Z written by earlier editor versions; see
      bimdown-editor/scripts/migrate-spatial-z.mjs.

  - name: discipline
    type: enum
    values: [architecture, structure, mep]
    description: |
      Discipline the editor opens the project in, e.g. "mep" for an imported
      MEP model (written by `import-ifc` for MEP / structural models).
      Default architecture.
  - name: numbering
    type: object
    description: |
      Auto-numbering (marks) per table: table name → prefix, e.g.
      {"structure_column": "KZ", "beam": "KL", "foundation": "J", "equipment": "AHU-"}.
      Tools that number elements write `number` = prefix + 1, 2, 3 … (doors and
      rooms: level number + sequence). Missing tables use the tool defaults.

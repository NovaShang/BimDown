name: cable_tray
bases:
  - spatial_line_element
  - section_profile
  - mep_system_tag
  - mep_connectable

fields:
  - name: max_fill
    type: float
    unit: none
    description: >
      Allowed fill ratio, percent of the tray's size_x × size_y section
      (cables routed through it by circuit.cable_trays plus conduits laid in
      it). Empty = 40.

name: duct
bases:
  - spatial_line_element
  - section_profile
  - mep_system_tag
  - mep_connectable
  - mep_insulated

fields:
  - name: flexible
    type: boolean
    description: >
      true = flexible duct (round, short runs to terminals); drawn as a
      flex hose. Empty / false = rigid sheet-metal duct.

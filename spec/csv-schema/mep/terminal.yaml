name: terminal
bases:
  - point_element
  - mep_system_tag

fields:
  - name: terminal_type
    type: enum
    values:
      - supply_air_diffuser
      - return_air_grille
      - exhaust_air_grille
      - sprinkler_head
      - fire_alarm_device
      - light_fixture
      - power_outlet
      - data_outlet
      - plumbing_fixture
      - other

  - name: family
    type: text
    description: >
      Family name from source CAD/BIM tool (e.g. Revit Family.Name).
      Free-form text. Used for round-trip fidelity.

  - name: type
    type: text
    description: >
      Family type / symbol name from source CAD/BIM tool. Free-form text.

name: circuit
bases:
  - element

description: >
  Electrical branch circuit fed from a panelboard (or any electrical
  equipment). CSV-only, like connector: one row per circuit, stored in the
  level directory of its panel. `number` is the circuit number shown on the
  panel schedule ("1", "L-3"). Devices (terminal / equipment) join a circuit
  through their `circuit_id`; the circuit's connected load is the sum of its
  devices' `load`.

fields:
  - name: host_id
    type: reference
    reference: element
    required: true
    description: ID of the panel (equipment, usually equipment_type=panelboard) feeding the circuit.

  - name: name
    type: string
    description: Label, e.g. "Lighting - Open office".

  - name: voltage
    type: float
    unit: none
    description: Nominal voltage, V (e.g. 230, 400).

  - name: poles
    type: int
    unit: none
    description: Breaker poles (1, 2 or 3).

  - name: rating
    type: float
    unit: none
    description: Breaker rating, A.

  - name: phase
    type: enum
    values:
      - L1
      - L2
      - L3
      - L1L2
      - L2L3
      - L3L1
      - L1L2L3
    description: >
      Phase(s) the circuit is connected to. One phase = single-phase load at
      the phase-neutral voltage; two = a line-to-line load split evenly over
      both; L1L2L3 = three-phase load (I = P / (√3 · U · cosφ), U line-to-line).
      Empty = L1L2L3 when poles = 3, else unassigned single-phase.

  - name: power_factor
    type: float
    unit: none
    description: cosφ of the connected load (0 < pf ≤ 1). Empty = 0.9.

  - name: cable_size
    type: float
    description: >
      Outer diameter of the circuit's cable (length unit). Used with
      cable_trays for the tray fill ratio.

  - name: cable_trays
    type: string
    description: >
      Cable trays the circuit's cable runs in: cable_tray ids separated by
      ";" (e.g. "ct-1;ct-2"). Each tray's fill counts the cable's section.

name: mep_node
bases:
  - point_element
  - mep_system_tag

# mep_node represents an MEP fitting/accessory in the physical sense
# (Revit's MEPFamilyInstance): a tee, elbow, coupling, valve, damper, etc.
# It is the vertex in the (pipe-as-edge, fitting-as-vertex) topology graph.
#
# Passive fittings (coupling/elbow/tee/cross/reducer/transition/cap):
#   leave `kind` empty — runtime derives it from the connected pipes'
#   count, angles, and sizes. CSV stays minimal (just id + position).
#
# Functional accessories (valve/damper/pump/strainer/check_valve/etc.):
#   set `kind` explicitly. `family` and the size attrs carry the catalog
#   metadata needed for Revit round-trip.

fields:
  - name: kind
    type: enum
    required: false
    description: >
      Empty for passive fittings (kind derived from topology at runtime).
      Set explicitly for functional accessories.
    values:
      - valve
      - gate_valve
      - ball_valve
      - butterfly_valve
      - globe_valve
      - balancing_valve
      - damper
      - fire_damper
      - pump
      - strainer
      - check_valve
      - flow_meter
      - sensor
      - access_panel
      - other_accessory
      - custom

  - name: fitting
    type: enum
    required: false
    description: >
      Passive fittings only (kind empty). Empty = the fitting is derived
      from the incident curves (see mep-port-conventions.md §4). Set it
      only where geometry can't tell: `tap` = a branch cut straight into
      the main (no tee body); `cap` = an intentional closed end (a node
      with a single curve); `open` = an intentional open end (vent
      through the roof, outfall); `wye` = a 45° branch (drainage). Other
      values record the derived kind.
    values:
      - elbow
      - tee
      - tap
      - wye
      - cross
      - reducer
      - transition
      - coupling
      - cap
      - open

  - name: family
    type: text
    required: false
    description: >
      Family name from source CAD/BIM tool (e.g. Revit Family.Name).
      Free-form text. Round-trip fidelity.

  - name: type
    type: text
    required: false
    description: >
      Family type / symbol name from source CAD/BIM tool. Free-form text.

  - name: shape
    type: enum
    required: false
    description: Cross-section shape of accessory body (only used when kind is set).
    values:
      - round
      - rect

  - name: size_w
    type: float
    required: false
    description: Accessory body width (only used when kind is set).

  - name: size_h
    type: float
    required: false
    description: Accessory body height (only used when kind is set).

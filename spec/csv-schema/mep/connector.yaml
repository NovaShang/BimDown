name: connector
bases:
  - element

description: >
  Connection port (socket) on an equipment / terminal / mep_node. Each row
  is one port. The host element exposes the port via host_id; the port
  carries a local-frame offset (relative to host origin), an outward
  direction unit vector, a cross-section (shape + size), a flow direction,
  a domain, and an optional system_type.

  The pair (host_id, name) is the port identity. MEP curves (pipe / duct /
  conduit / cable_tray) reference a port via `from` / `to` columns with the
  syntax "host_id:name" (see mep_connectable). Passive mep_node fittings
  (auto-elbow/tee/cross/coupling/cap/transition) do NOT get connector rows
  — their ports are derived from connected-pipe geometry at runtime.

  CSV-only: connectors have no independent 2D geometry — their world
  position is host.origin + R(host.rotation) · offset at render time.

fields:
  - name: host_id
    type: reference
    reference: element
    required: true
    description: ID of the host equipment / terminal / mep_node.

  - name: name
    type: string
    required: true
    description: >
      Port name unique within the host. Used as the suffix in pipe.from/to:
      "host_id:name". Prefer lowercase semantic names ("supply", "return",
      "inlet", "outlet", "in", "out", "sa", "ra", "condensate"); when no
      semantic name applies (e.g. Revit family with anonymous connectors),
      fall back to "c0", "c1", ... in ConnectorManager index order. See
      spec/mep-port-conventions.md for the recommended vocabulary.

  - name: offset_x
    type: float
    default: 0
    description: X offset from host origin, host local frame, meters.

  - name: offset_y
    type: float
    default: 0
    description: Y offset from host origin, host local frame, meters.

  - name: offset_z
    type: float
    default: 0
    description: Z offset from host origin (added to host base_offset), meters.

  - name: dir_x
    type: float
    default: 1
    description: Outward unit-vector X component (direction the pipe/duct exits), host local frame.

  - name: dir_y
    type: float
    default: 0
    description: Outward unit-vector Y component, host local frame.

  - name: dir_z
    type: float
    default: 0
    description: Outward unit-vector Z component, host local frame.

  - name: shape
    type: enum
    description: Cross-section shape of the port opening.
    values:
      - round
      - rect

  - name: size_w
    type: float
    description: Cross-section width (or diameter when shape=round), meters.

  - name: size_h
    type: float
    description: Cross-section height (rect only), meters.

  - name: system_type
    type: string
    description: >
      System tag this port carries (e.g. "CHWS", "RA"). Used for color
      coding and system compatibility checks at draw time. Pipes drawn
      from this port inherit this system_type.

  - name: flow_dir
    type: enum
    description: >
      Flow direction of the port from the host's perspective. Matches Revit
      Connector.Direction. Used for validating connections (out → in is
      well-formed) and drawing flow arrows.
    values:
      - in
      - out
      - bidirectional

  - name: domain
    type: enum
    description: >
      Engineering domain of the port. Matches Revit Connector.Domain.
      Disambiguates ports on multi-domain equipment (e.g. an AHU has
      piping ports for hydronic and hvac ports for air).
    values:
      - hvac
      - piping
      - electrical
      - cable_tray_conduit

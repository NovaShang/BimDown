name: vertical_span
abstract: true

fields:
  - name: base_level_id
    type: reference
    reference: level
    description: Base level. Defaults to the containing directory's level (implicit for level-N/ directories). Must be set explicitly for elements in global/.

  - name: top_level_id
    type: reference
    reference: level
    description: Top constraint level. Empty = level immediately above base_level_id.

  - name: top_offset
    type: float
    default: 0
    storage: geojson_property
    description: Vertical offset from top_level_id, meters. Stored in GeoJSON Feature properties.

  - name: height
    type: float
    computed: true

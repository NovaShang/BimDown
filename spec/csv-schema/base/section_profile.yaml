name: section_profile
abstract: true

fields:
  - name: shape
    type: enum
    required: true
    values:
      - rect
      - round
      - oval
    description: >
      oval = flat oval duct: two parallel flat sides and semicircular ends,
      size_x the major axis, size_y the minor one (ducts only; other tables
      treat it as rect).

  - name: size_x
    type: float

  - name: size_y
    type: float

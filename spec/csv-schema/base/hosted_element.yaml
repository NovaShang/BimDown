name: hosted_element
bases:
  - element
abstract: true

fields:
  # Override element.base_offset (geojson_property) → CSV: hosted elements are
  # CSV-only (no GeoJSON file), so their sill/base height lives in the CSV.
  - name: base_offset
    type: float
    default: 0
    storage: csv
    description: Sill/base height — vertical offset of the opening bottom from the host's base level, meters. Windows default to a 0.9m sill in viewers when unset.

  - name: host_id
    type: reference
    reference: element
    description: ID of the host wall/floor. Required unless host_x/host_y are provided (auto-resolved by build).

  - name: position
    type: float
    description: Distance in length units from the host element's start point to the center of this opening. Required unless host_x/host_y are provided (auto-resolved by build).

  - name: host_x
    type: float
    description: X coordinate of the opening center (alternative to position). Build auto-resolves to host_id + position.

  - name: host_y
    type: float
    description: Y coordinate of the opening center (alternative to position). Build auto-resolves to host_id + position.

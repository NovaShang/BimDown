name: structural_section_profile
abstract: true
description: >
  Structural cross-section profile. The editor treats each shape as a small
  parametric family (FAMILY_VISION.md): `shape` selects the family, the
  remaining fields are that family's parameters. Not all shapes use all
  fields — values left blank fall back to a proportional default derived
  from `size_x` / `size_y`.

  Per-shape parameter usage:
    rect:    size_x = width, size_y = depth
    round:   size_x = diameter (size_y unused)
    i_shape: size_x = flange width, size_y = total depth, flange + web thicknesses
    t_shape: size_x = flange width, size_y = total depth, flange + web thicknesses
    l_shape: size_x = leg X length, size_y = leg Y length, thickness = leg thk
    c_shape: size_x = flange width, size_y = total depth, flange + web thicknesses
    cross:   size_x = arm length X, size_y = arm length Y, thickness = arm thk
    rect_hollow:  size_x = width, size_y = depth, thickness = wall thk,
                  root_radius = outer corner radius (RHS / SHS / rectangular HSS)
    round_hollow: size_x = outside diameter, thickness = wall thk (CHS / round HSS)
    open_web:     open-web steel joist (K / LH series bar joist): size_x = chord
                  width, size_y = joist depth, flange = chord depth, thickness =
                  chord angle thk. Only the top and bottom chords are solid (clash
                  checks see the open web); area = 4.6 × thickness × (size_x / 2 +
                  flange − thickness) (two double-angle chords + 15 % web rods).

  `designation` names a catalogue section (HEA 300, W14X90, HSS8X8X1/2,
  CHS 219.1x8); tools use it as the IFC ProfileName. Steel weight per metre =
  section area (root fillets / rounded corners included) × 7850 kg/m³.

fields:
  - name: shape
    type: enum
    required: true
    values:
      - rect
      - round
      - l_shape
      - t_shape
      - cross
      - i_shape
      - c_shape
      - rect_hollow
      - round_hollow
      - open_web

  - name: size_x
    type: float

  - name: size_y
    type: float

  - name: flange
    type: float
    description: Flange thickness — used by i_shape / t_shape / c_shape; chord depth of open_web.

  - name: web
    type: float
    description: Web thickness — used by i_shape / t_shape / c_shape.

  - name: thickness
    type: float
    description: Leg / arm thickness — used by l_shape / cross; wall thickness of rect_hollow / round_hollow; chord angle thickness of open_web.

  - name: root_radius
    type: float
    description: Root fillet radius of i_shape / t_shape / c_shape / l_shape (web-flange or leg junction); outer corner radius of rect_hollow. Empty = sharp.

  - name: designation
    type: string
    description: Catalogue section designation, e.g. HEA 300, IPE 300, W14X90, HSS8X8X1/2, CHS 219.1x8, 14K1 (open-web joist). Used as the IFC ProfileName.

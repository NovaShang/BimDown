name: element
abstract: true

fields:
  - name: id
    type: string
    required: true

  - name: number
    type: string

  - name: level_id
    type: reference
    reference: level
    computed: true

  - name: created_at
    type: datetime
    computed: true

  - name: updated_at
    type: datetime
    computed: true

  - name: base_offset
    type: float
    default: 0
    storage: geojson_property
    description: Vertical offset from base_level_id, meters. Stored in GeoJSON Feature properties.

  - name: mesh_file
    type: string
    description: Optional GLB mesh path for precise 3D visualization

  - name: volume
    type: float
    computed: true

  - name: bbox_min_x
    type: float
    computed: true

  - name: bbox_min_y
    type: float
    computed: true

  - name: bbox_min_z
    type: float
    computed: true

  - name: bbox_max_x
    type: float
    computed: true

  - name: bbox_max_y
    type: float
    computed: true

  - name: bbox_max_z
    type: float
    computed: true


name: element
abstract: true

fields:
  - name: id
    type: string
    required: true

  - name: number
    type: string

  - name: level_id
    type: reference
    reference: level
    computed: true

  - name: base_offset
    type: float
    default: 0
    storage: geojson_property
    description: Vertical offset from base_level_id, meters. Stored in GeoJSON Feature properties.

  - name: mesh_file
    type: string
    description: Optional GLB mesh path for precise 3D visualization

  # bbox extent in meters. For FamilyInstance elements (equipment, terminal,
  # door, window, structural_column, …) values are in the family's local frame —
  # shared across all instances of the same type, independent of placement
  # rotation. For non-FamilyInstance elements (wall, slab, …) values are the
  # world-axis-aligned bounding box.
  - name: bbox_min_x
    type: float

  - name: bbox_min_y
    type: float

  - name: bbox_min_z
    type: float

  - name: bbox_max_x
    type: float

  - name: bbox_max_y
    type: float

  - name: bbox_max_z
    type: float


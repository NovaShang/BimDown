name: element
abstract: true

fields:
  - name: id
    type: string
    required: true

  - name: number
    type: string

  - name: level_id
    type: reference
    reference: level
    computed: true

  - name: base_offset
    type: float
    default: 0
    storage: geojson_property
    description: Vertical offset from base_level_id, meters. Stored in GeoJSON Feature properties.

  - name: mesh_file
    type: string
    description: Optional GLB mesh path for precise 3D visualization

  # bbox extents in meters. Not stored in CSV — exposed instead as the optional
  # `size: [x, y, z]` GeoJSON Feature property on Point features (equipment,
  # terminal, mep_node, column, …). For FamilyInstance elements the bbox is
  # taken from the family symbol (local frame, rotation-invariant); for system
  # families it is the world-axis-aligned bounding box.
  - name: bbox_min_x
    type: float
    computed: true

  - name: bbox_min_y
    type: float
    computed: true

  - name: bbox_min_z
    type: float
    computed: true

  - name: bbox_max_x
    type: float
    computed: true

  - name: bbox_max_y
    type: float
    computed: true

  - name: bbox_max_z
    type: float
    computed: true


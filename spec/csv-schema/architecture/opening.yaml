name: opening
bases:
  - element
description: >
  Opening (void) in a host element. host_id is always required.
  Geometry form depends on the host type:
  - Wall opening: host_id references a wall. Uses position (distance in meters from wall start),
    width, and height. No GeoJSON geometry.
  - Slab opening: host_id references a slab. Uses a GeoJSON Polygon (2D, in slab plane)
    to define the void shape.

fields:
  - name: host_id
    type: reference
    reference: element
    required: true

  - name: position
    type: float
    description: Distance in meters from wall start to center of opening. Only for wall openings.

  - name: width
    type: float
    description: Opening width. Required for wall openings.

  - name: height
    type: float
    description: Opening height. Only for wall openings.

  - name: shape
    type: enum
    values:
      - rect
      - round
      - arch
    description: Opening shape. Only for wall openings.

name: opening
bases:
  - element
description: >
  Opening (void) in a host element. Geometry form depends on the host type:
  - Wall opening: host_id references a wall. Uses position (distance in meters from wall start),
    width, and height. No GeoJSON geometry.
  - Slab / roof opening: host_id references a slab, structure_slab or roof. Uses a GeoJSON
    Polygon (2D plan) to define the void shape, cut vertically (skylights, dormer openings).
  - Shaft: a Polygon opening with top_level_id. It cuts every slab, structure_slab, ceiling and roof
    whose body lies between its bottom (this level + base_offset) and its top
    (top_level_id + top_offset), on every level. host_id may be empty.

fields:
  - name: host_id
    type: reference
    reference: element
    description: Host wall / slab / roof. Required except for shafts (top_level_id set).

  - name: position
    type: float
    description: Distance in meters from wall start to center of opening. Only for wall openings.

  - name: width
    type: float
    description: Opening width. Required for wall openings.

  - name: height
    type: float
    description: Opening height. Only for wall openings.

  - name: shape
    type: enum
    values:
      - rect
      - round
      - arch
    description: Opening shape. Only for wall openings.

  # Wall openings have no GeoJSON feature, so their sill height lives in the
  # CSV (same as door/window). Slab openings leave it empty.
  - name: base_offset
    type: float
    default: 0
    storage: csv
    description: Sill height of a wall opening above the host's base level, meters; for a shaft, its bottom above this level.

  - name: top_level_id
    type: reference
    reference: level
    description: Shaft only - the level the shaft rises to. Empty = an opening in its host only.

  - name: top_offset
    type: float
    default: 0
    storage: csv
    description: Shaft only - offset of the shaft top from top_level_id, meters.

name: roof
bases:
  - polygon_element
  - materialized

fields:
  - name: roof_type
    type: enum
    required: true
    values:
      - flat
      - gable
      - hip
      - shed
      - mansard

  - name: slope
    type: float
    description: Slope angle in degrees (0 = flat roof)

  - name: thickness
    type: float

  - name: type_id
    type: reference
    reference: roof_type
    description: Optional roof_type id. Empty type parameters (thickness, material) inherit the type's value; a set value overrides it for this element.

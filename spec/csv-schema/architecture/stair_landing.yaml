name: stair_landing
bases:
  - polygon_element
  - materialized
description: >
  Landing platform between two stair runs. Hosted on a `stair` row via host_id.
  Stored as a polygon (the landing's plan footprint, any outline) plus a single
  elevation (`base_offset` above level). Multiple landings can host on the same
  stair for U / W / switchback configurations. The landing's top equals the top
  of the run that arrives on it (tools keep them in step); the run leaving it
  starts at that height.

  Winders: with `step_count` > 0 the landing is not flat but turns as that
  many winder treads (riser lines radiating from the inner corner of an L, or
  from the middle of the well side of a U, equal going on the walking line).
  Tread i is base_offset + i risers; the run leaving it starts on the last one
  (base_offset + step_count risers). Its risers count in the stair's riser rule.

fields:
  - name: host_id
    type: reference
    reference: element
    required: true
    description: ID of the parent stair row.

  - name: base_offset
    type: float
    description: Top elevation of the landing relative to the stair's level (m).

  - name: thickness
    type: float
    description: Slab thickness of the landing (m), hanging below its top. Defaults to 0.15 if blank.

  - name: step_count
    type: int
    description: Winder risers in the turn (0 / empty = flat landing).

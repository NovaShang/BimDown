name: space
bases:
  - element

fields:
  - name: x
    type: float
    required: true
    description: Seed point X coordinate (room interior point)

  - name: y
    type: float
    required: true
    description: Seed point Y coordinate (room interior point)

  - name: name
    type: string

  - name: boundary_points
    type: string
    computed: true
    description: Space boundary polygon vertices (computed by build from surrounding walls)

  - name: area
    type: float
    computed: true
    description: Gross space area at the wall centre lines (the boundary polygon), in project units squared

  - name: net_area
    type: float
    computed: true
    description: Net space area at the wall finish faces — each boundary edge moved inward by half the thickness of its wall (room separators 0); the area drawings, tags and schedules show. Written by build into space.geojson

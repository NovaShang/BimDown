name: furniture
description: >
  Built-in parametric component (furniture, casework, appliances without MEP
  ports, toilet partitions, cars and parking spaces, trees and plants, scale
  figures, generic placeholders). GeoJSON Point at the footprint centre;
  properties.rotation turns it CCW (degrees); base_offset raises it (wall
  cabinets). Local frame: size_x = width, size_y = depth, +Y is the BACK (put
  it against the wall), so rotation 0 faces -Y (south). Empty size fields take
  the family / variant default. Plan symbols and 3D massing come from the
  built-in library (`bimdown schema furniture` lists families and variants).
  Exporters: IFC4 IfcFurniture (desk/chair/table/bed/sofa/shelf/file cabinet
  predefined types), IfcElectricAppliance (appliances), IfcFurnishingElement
  (toilet partitions, plants), IfcGeographicElement (trees),
  IfcBuildingElementProxy (cars, parking, people, generic).
bases:
  - point_element
  - furniture_params

fields:
  - name: mirror
    type: enum
    values: ["true", "false"]
    description: Mirror left-right (e.g. an L-shape desk with the return on the left).

  - name: type_id
    type: reference
    reference: furniture_type
    description: Optional furniture_type id. Empty type parameters (family, variant, size_x, size_y, height) inherit the type's value; a set value overrides it for this element.

name: furniture
description: >
  Built-in parametric component (furniture, casework, appliances without MEP
  ports, toilet partitions, cars and parking spaces, trees and plants, scale
  figures, generic placeholders). GeoJSON Point at the footprint centre;
  properties.rotation turns it CCW (degrees); base_offset raises it (wall
  cabinets). Local frame: size_x = width, size_y = depth, +Y is the BACK (put
  it against the wall), so rotation 0 faces -Y (south). Empty size fields take
  the family / variant default. Plan symbols and 3D massing come from the
  built-in library (`bimdown schema furniture` lists families and variants).
  Exporters: IFC4 IfcFurniture (desk/chair/table/bed/sofa/shelf/file cabinet
  predefined types), IfcElectricAppliance (appliances), IfcFurnishingElement
  (toilet partitions, plants), IfcGeographicElement (trees),
  IfcBuildingElementProxy (cars, parking, people, generic).
bases:
  - point_element

fields:
  - name: family
    type: enum
    required: true
    description: Library family. Schedules count instances with GROUP BY family, variant.
    values:
      - desk
      - office_chair
      - chair
      - meeting_table
      - dining_table
      - coffee_table
      - sofa
      - armchair
      - bed
      - nightstand
      - wardrobe
      - bookshelf
      - filing_cabinet
      - sideboard
      - reception_counter
      - locker
      - base_cabinet
      - wall_cabinet
      - tall_cabinet
      - refrigerator
      - stove
      - dishwasher
      - washing_machine
      - toilet_partition
      - car
      - parking_space
      - tree
      - plant
      - person
      - generic_box
      - generic_cylinder

  - name: variant
    type: string
    description: >
      Family variant (e.g. bed single/double/king, sofa 2_seat/3_seat/l_shape,
      desk standard/pedestal/l_shape, base_cabinet doors/drawers/sink). Empty =
      the family's first variant. Must be a variant of the family.

  - name: size_x
    type: float
    description: Width along the local X axis (left-right when facing the front), meters.

  - name: size_y
    type: float
    description: Depth along the local Y axis (front to back), meters.

  - name: height
    type: float
    description: Overall height above the base, meters.

  - name: mirror
    type: enum
    values: ["true", "false"]
    description: Mirror left-right (e.g. an L-shape desk with the return on the left).

  - name: type_id
    type: string
    description: >
      Optional element type id (type catalog in global/). Reserved for a
      furniture_type table; empty fields of the instance would inherit from it.

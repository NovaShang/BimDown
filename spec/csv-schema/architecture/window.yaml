name: window
bases:
  - hosted_element
  - materialized
host_type: wall

fields:
  - name: width
    type: float
    required: true

  - name: height
    type: float

  - name: operation
    type: enum
    description: How the window opens. Mirrors IFC IfcWindowTypePartitioningEnum.
    values:
      - fixed
      - casement
      - sliding
      - awning
      - hopper
      - pivot
      - double_hung
      - single_hung
      - tilt_and_turn

  - name: type_id
    type: reference
    reference: window_type
    description: Optional window_type id. Empty type parameters (width, height, operation, material) inherit the type's value; a set value overrides it for this element.

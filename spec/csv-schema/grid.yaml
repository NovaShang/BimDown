name: grid

fields:
  - name: id
    type: string
    required: true

  - name: number
    type: string
    required: true

  - name: start_x
    type: float
    required: true

  - name: start_y
    type: float
    required: true

  - name: end_x
    type: float
    required: true

  - name: end_y
    type: float
    required: true

  - name: pinned
    type: enum
    values: ["true", "false"]
    description: '"true" = pinned (editors must not move it). Empty = not pinned.'

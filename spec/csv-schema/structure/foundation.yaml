name: foundation
bases:
  - element
  - materialized
description: >
  Unified foundation type. Geometry form is determined by the GeoJSON geometry type:
  - Point: isolated/pad footing (section in CSV: shape, size_x, size_y)
  - LineString: strip/continuous footing (thickness, width in CSV)
  - Polygon: raft/mat foundation
  Computed geometry fields are hydrated from GeoJSON at query time.

fields:
  - name: thickness
    type: float

  - name: width
    type: float
    description: Width of strip foundation or pad dimension

  - name: length
    type: float
    description: Length of pad foundation

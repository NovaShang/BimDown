name: beam
bases:
  - spatial_line_element
  - structural_section_profile
  - materialized

fields:
  - name: type_id
    type: reference
    reference: beam_type
    description: Optional beam_type id. Empty type parameters (shape, size_x, size_y, flange, web, thickness, material) inherit the type's value; a set value overrides it for this element.

  - name: beam_system_id
    type: reference
    reference: beam_system
    description: Beam system (same level) that generated this beam; tools regenerate it with the system. Empty = a free beam.

  - name: material_grade
    type: string
    description: Strength grade, e.g. C30 (concrete), Q355 / S355 (steel), GL24h (timber).

  - name: volume
    type: float
    computed: true
    description: Material volume (section × length / height, area × thickness), hydrated at query time.

  - name: weight
    type: float
    computed: true
    description: Mass in kg (volume × material density, steel 7850 kg/m³), hydrated at query time.

name: structure_wall
bases:
  - line_element
  - vertical_span
  - materialized

fields:
  - name: thickness
    type: float

  - name: type_id
    type: reference
    reference: wall_type
    description: Optional wall_type id. Empty type parameters (thickness, material) inherit the type's value; a set value overrides it for this element.

  - name: top_attach_id
    type: reference
    reference: element
    description: >
      Attach Top (Revit): id of a roof or slab (any level) whose underside the
      wall top follows wherever the wall is under it; elsewhere the wall keeps
      its top_level_id / top_offset top. Empty = not attached.

  - name: material_grade
    type: string
    description: Strength grade, e.g. C30 (concrete), Q355 / S355 (steel), GL24h (timber).

  - name: volume
    type: float
    computed: true
    description: Material volume (section × length / height, area × thickness), hydrated at query time.

name: structure_wall
bases:
  - line_element
  - vertical_span
  - materialized

fields:
  - name: thickness
    type: float

  - name: material_grade
    type: string
    description: Strength grade, e.g. C30 (concrete), Q355 / S355 (steel), GL24h (timber).

  - name: volume
    type: float
    computed: true
    description: Material volume (section × length / height, area × thickness), hydrated at query time.

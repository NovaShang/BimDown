name: structure_column
bases:
  - point_element
  - vertical_span
  - materialized
  - structural_section_profile

fields:
  - name: type_id
    type: reference
    reference: column_type
    description: Optional column_type id. Empty type parameters (shape, size_x, size_y, flange, web, thickness, material) inherit the type's value; a set value overrides it for this element.

  - name: material_grade
    type: string
    description: Strength grade, e.g. C30 (concrete), Q355 / S355 (steel), GL24h (timber).

  - name: volume
    type: float
    computed: true
    description: Material volume (section × length / height, area × thickness), hydrated at query time.

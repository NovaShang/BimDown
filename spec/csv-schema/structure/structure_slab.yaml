name: structure_slab
bases:
  - polygon_element
  - materialized

fields:
  - name: function
    type: enum
    values:
      - floor
      - roof

  - name: thickness
    type: float

  - name: type_id
    type: reference
    reference: slab_type
    description: Optional slab_type id. Empty type parameters (thickness, material) inherit the type's value; a set value overrides it for this element.

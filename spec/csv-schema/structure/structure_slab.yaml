name: structure_slab
bases:
  - polygon_element
  - materialized
  - wall_bounded

fields:
  - name: function
    type: enum
    values:
      - floor
      - roof

  - name: thickness
    type: float

  - name: type_id
    type: reference
    reference: slab_type
    description: Optional slab_type id. Empty type parameters (thickness, material) inherit the type's value; a set value overrides it for this element.

  - name: material_grade
    type: string
    description: Strength grade, e.g. C30 (concrete), Q355 / S355 (steel), GL24h (timber).

  - name: span_direction
    type: float
    description: Main span direction of a one-way slab or deck, degrees CCW from +X. Empty = two-way / not set.

  - name: slope_arrow
    type: string
    description: >
      Sloped floor (Revit slope arrow): "tx,ty,tz;hx,hy,hz" = plan tail and head
      points (m) and the top's height (m) above level + base_offset at each.
      The top is the plane through them, level across the arrow (the head need
      not lie inside the outline); thickness stays vertical. Empty = flat.

  - name: volume
    type: float
    computed: true
    description: Material volume (section × length / height, area × thickness), hydrated at query time.

  - name: net_area
    type: float
    computed: true
    description: Plan area net of inner rings and of the Polygon openings hosted on this slab, hydrated at query time.
